<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <header class="header">
    <h1>Techup Chatroom</h1>
</header>

<!-- พื้นที่แสดงข้อความแชท -->
<main class="chat-container">
    
    <!-- ฝั่งซ้าย (ข้อความที่ได้รับ) -->
    <div class="message incoming">
        😍
    </div>
    
    <div class="message incoming">
        🐥
    </div>

    <!-- ฝั่งขวา (ข้อความที่ส่ง) -->
    <div class="message outgoing green">
        สวัสดีจ้า
    </div>

    <div class="message outgoing gray">
        Coding สนุกจังเลย
    </div>

    <div class="message outgoing green">
        🤩 🤩
    </div>

</main>
</body>

</html>
