<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>

  <!-- Header -->
    <header class="header">
      Techup Chatroom
    </header>

    <!-- Chatroom -->
    <div class="chatroom">

      <!-- Left messages -->
      <div class="message left message-left-1">
        😍
      </div>

      <div class="message left message-left-2">
        😘
      </div>

      <!-- Right messages -->
      <div class="message right message-right-1">
        สวัสดีจ้า
        <span class="status"></span>
      </div>

      <div class="message right gray message-right-2">
        Coding สนุกจังเลย
        <span class="notification">1</span>
      </div>

      <div class="message right message-right-3">
        😘 😍
      </div>

    </div>


</html>
