<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <div class="chat-card">
    <div class="chat-header">
      Techup Chatroom
    </div>
  
    <div class="chat-body">
      
      <div class="chat-row right">
        <div class="bubble green">
          สวัสดีจ้า
          <span class="tail-right"></span>
        </div>
      </div>
  
      <div class="chat-row right">
        <div class="bubble gray-light">
          Coding สนุกจังเลย
          <button class="close-btn">x</button>
        </div>
      </div>
  
      <div class="chat-row right">
        <div class="bubble green">
          🥳 🥳
          <span class="tail-right"></span>
        </div>
      </div>
  

      <div class="chat-row left">
        <div class="bubble gray-dark">
          😻
        </div>
      </div>
  
      <div class="chat-row left">
        <div class="bubble gray-dark">
          🥰
        </div>
      </div>
  
    </div>
  </div>
</body>

</html>
